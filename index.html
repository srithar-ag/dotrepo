<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Ignore Vite HMR WebSocket connection failure in AI Studio preview iframe -->
    <script>
      (function () {
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason;
          var msg = (reason && (reason.message || String(reason))) || '';
          var stack = (reason && reason.stack) || '';
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('vite:ws') !== -1 ||
            stack.indexOf('@vite/client') !== -1
          ) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        });
        window.addEventListener('error', function (event) {
          var msg = (event && event.message) || '';
          var file = (event && event.filename) || '';
          if (
            msg.indexOf('WebSocket') !== -1 ||
            file.indexOf('@vite/client') !== -1
          ) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        });
      })();
    </script>
    <title>DotRepo - Enterprise Cloud, Software, Data & AI Ecosystem</title>
    <meta name="description" content="DotRepo provides enterprise cloud software, intelligent applications, data platforms, and AI-powered technologies that power modern businesses." />
    <meta property="og:title" content="DotRepo - Enterprise Cloud, Software, Data & AI Ecosystem" />

  </head>
